name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: parqueadero
          POSTGRES_PASSWORD: parqueadero
          POSTGRES_DB: parqueadero
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql://parqueadero:parqueadero@localhost:5432/parqueadero
      JWT_SECRET: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2
      PLATE_ENCRYPTION_KEY: 1f2e3d4c5b6a798081828384858687881f2e3d4c5b6a79808182838485868788
      SYNC_API_KEY: 3f92bfde-40c1-4ba3-b796-bfb53d4da3c4

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test --coverage

      - run: pnpm build
