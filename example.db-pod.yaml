apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: parqueadero-pgdata
  labels:
    app: parqueadero
    tier: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "10Gi"
---
apiVersion: v1
kind: Pod
metadata:
  name: parqueadero-db
  labels:
    app: parqueadero
    tier: database
spec:
  containers:
    - name: postgres
      image: docker.io/library/postgres:16
      ports:
        - containerPort: 5432
      env:
        - name: POSTGRES_USER
          value: parqueadero
        - name: POSTGRES_DB
          value: parqueadero
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: parqueadero-secrets
              key: db_password
      volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
  volumes:
    - name: pgdata
      persistentVolumeClaim:
        claimName: parqueadero-pgdata
---
kind: Secret
metadata:
  name: parqueadero-secrets
  labels:
    app: parqueadero
stringData:
  db_password: "CAMBIAR_POR_PASSWORD_SEGURA"
  database_url: "postgresql://parqueadero:CAMBIAR_POR_PASSWORD_SEGURA@parqueadero-db:5432/parqueadero"
  jwt_secret: "CAMBIAR_POR_CLAVE_DE_32_CARACTERES_MINIMO"
  plate_encryption_key: "CAMBIAR_POR_CLAVE_HEX_DE_64_CARACTERES_EXACTOS"
  sync_api_key: "CAMBIAR_POR_UUID_O_CLAVE_DE_16_CARACTERES_MINIMO"
