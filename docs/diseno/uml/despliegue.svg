ont-size="10" fill="#111827" font-weight="normal" text-anchor="start">Secret</text><text x="348" y="333.9" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#111827" font-weight="normal" text-anchor="start">parqueadero-secrets</text><text x="348" y="346.9" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#111827" font-weight="normal" text-anchor="start">db_password, jwt, plate, sync</text><rect x="640" y="110" width="840" height="460" rx="0" fill="#f8fafc" stroke="#374151" stroke-width="1.5"/><text x="650" y="130" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#111827" font-weight="bold">Pod parqueadero-app</text><rect x="680" y="170" width="340" height="110" rx="0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="850.0" y="208.2" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#111827" font-weight="normal" text-anchor="middle">backend</text><text x="850.0" y="222.2" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#111827" font-weight="normal" text-anchor="middle">node:22-alpine</text><text x="850.0" y="236.2" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#111827" font-weight="normal" text-anchor="middle">CMD node dist/server.js</text><text x="850.0" y="250.2" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#111827" font-weight="normal" text-anchor="middle">containerPort 3000 (interno)</text><rect x="1060" y="170" width="380" height="110" rx="0" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><text x="1250.0" y="208.2" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#111827" font-weight="normal" text-anchor="middle">frontend</text><text x="1250.0" y="222.2" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#111827" font-weight="normal" text-anchor="middle">nginx:alpine</text><text x="1250.0" y="236.2" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#111827" font-weight="normal" text-anchor="middle">listen 443 (TLS)</text><text x="1250.0" y="250.2" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#111827" font-weight="normal" text-anchor="middle">hostPort 3001</text><rect x="680" y="328" width="180" height="72" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><ellipse cx="770.0" cy="328" rx="90.0" ry="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><text x="770.0" y="357.4" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#111827" font-weight="normal" text-anchor="middle">PVC uploads</text><text x="770.0" y="370.4" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#111827" font-weight="normal" text-anchor="middle">5Gi</text><rect x="880" y="328" width="180" height="72" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><ellipse cx="970.0" cy="328" rx="90.0" ry="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><text x="970.0" y="357.4" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#111827" font-weight="normal" text-anchor="middle">PVC backups</text><text x="970.0" y="370.4" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#111827" font-weight="normal" text-anchor="middle">5Gi</text><path d="M 1080 320 L 1426 320 L 1440 334 L 1440 400 L 1080 400 Z" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><path d="M 1426 320 L 1426 334 L 1440 334" fill="none" stroke="#d6b656"/><text x="1088" y="350.9" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#111827" font-weight="normal" text-anchor="start">hostPath TLS</text><text x="1088" y="363.9" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#111827" font-weight="normal" text-anchor="start">/etc/parqueadero/ssl -&gt; /etc/nginx/ssl</text><text x="1088" y="376.9" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#111827" font-weight="normal" text-anchor="start">(en local: ./ssl)</text><rect x="640" y="610" width="840" height="90" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/><text x="1060.0" y="659.5" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#111827" font-weight="normal" text-anchor="middle">Red interna parqueadero-net (DNS de podman: parqueadero-db:5432)</text><rect x="120" y="640" width="420" height="120" rx="0" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><text x="330.0" y="690.2" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#111827" font-weight="normal" text-anchor="middle">Usuario final</text><text x="330.0" y="704.2" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#111827" font-weight="normal" text-anchor="middle">Navegador -&gt; https://localhost:3001</text><text x="330.0" y="718.2" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#111827" font-weight="normal" text-anchor="middle">(o dominio con TLS valido)</text>
