apiVersion: v1
kind: Secret
metadata:
  name: parqueadero-secrets
  labels:
    app: parqueadero
stringData:
  db_password: "CAMBIAR_POR_PASSWORD_SEGURA"
  jwt_secret: "CAMBIAR_POR_CLAVE_DE_32_CARACTERES_MINIMO"
  plate_encryption_key: "CAMBIAR_POR_CLAVE_HEX_DE_64_CARACTERES_EXACTOS"
  sync_api_key: "CAMBIAR_POR_UUID_O_CLAVE_DE_16_CARACTERES_MINIMO"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: parqueadero-uploads
  labels:
    app: parqueadero
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "5Gi"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: parqueadero-backups
  labels:
    app: parqueadero
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "5Gi"
---
apiVersion: v1
kind: Pod
metadata:
  name: parqueadero-app
  labels:
    app: parqueadero
    tier: application
spec:
  containers:
    - name: backend
      image: localhost/parqueadero-backend:latest
      ports:
        - containerPort: 3000
      env:
        - name: DATABASE_URL
          value: "postgresql://parqueadero:$(DB_PASSWORD)@parqueadero-db:5432/parqueadero"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: parqueadero-secrets
              key: db_password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: parqueadero-secrets
              key: jwt_secret
        - name: JWT_EXPIRATION_MINUTES
          value: "30"
        - name: PLATE_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: parqueadero-secrets
              key: plate_encryption_key
        - name: SYNC_API_KEY
          valueFrom:
            secretKeyRef:
              name: parqueadero-secrets
              key: sync_api_key
        - name: PORT
          value: "3000"
        - name: NODE_ENV
          value: "production"
        - name: SERVE_STATIC
          value: "false"
      volumeMounts:
        - name: uploads
          mountPath: /app/uploads
        - name: backups
          mountPath: /app/backups
    - name: frontend
      image: localhost/parqueadero-frontend:latest
      ports:
        - containerPort: 80
          hostPort: 3000
  volumes:
    - name: uploads
      persistentVolumeClaim:
        claimName: parqueadero-uploads
    - name: backups
      persistentVolumeClaim:
        claimName: parqueadero-backups
